<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F3F0F7">
    <title>Cortex • College AI Assistant</title>

    <!-- SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23ebe5ff'/><path d='M50 24v52M24 50h52' stroke='%237c3aed' stroke-width='14' stroke-linecap='round'/><circle cx='50' cy='50' r='10' fill='%237c3aed'/></svg>">

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="cortex-body">

    <!-- 120Hz Ambient Canvas Background -->
    <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>

    <!-- Outer Presentation Wrapper -->
    <div class="cortex-outer-wrapper">
        <div class="cortex-window-frame" id="window-frame">

            <!-- ===================================================================
                 1. LEFT SIDEBAR (Cleaned & Campus-Focused)
                 =================================================================== -->
            <aside class="sidebar-container" id="sidebar-container">
                
                <!-- Sidebar Header: Brand & Collapse -->
                <div class="sidebar-header">
                    <div class="brand-group" id="brand-home-btn" title="Cortex College AI">
                        <div class="brand-logo-icon">
                            <svg viewBox="0 0 28 28" width="26" height="26" fill="none">
                                <rect width="28" height="28" rx="8" fill="#EBE5FF"/>
                                <path d="M14 6v16M6 14h16" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
                                <circle cx="14" cy="14" r="2.5" fill="#7C3AED"/>
                            </svg>
                        </div>
                        <span class="brand-name">Cortex</span>
                        <span class="fps-badge" id="fps-counter" title="Dynamic Refresh Rate">120 FPS</span>
                    </div>

                    <button class="sidebar-icon-btn" id="sidebar-collapse-btn" aria-label="Toggle Navigation Drawer" title="Toggle Sidebar">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                            <path d="m14 9-3 3 3 3"></path>
                        </svg>
                    </button>
                </div>

                <!-- Primary Action: + New Chat -->
                <div class="sidebar-new-chat-box">
                    <button class="new-chat-btn" id="new-chat-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New chat</span>
                    </button>
                </div>

                <!-- Search Input Bar with Command Key Hint -->
                <div class="sidebar-search-box">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="sidebar-search-input" placeholder="Search topics..." autocomplete="off" aria-label="Search past topics">
                        <span class="search-kbd-badge">⌘K</span>
                    </div>
                </div>

                <!-- Navigation Links List -->
                <div class="sidebar-nav-scroll">
                    <!-- Quick Topic Shortcuts -->
                    <div class="nav-links-group">
                        <button class="nav-link-item active" id="nav-all-btn" data-query="What is the admission process and eligibility?">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Admissions</span>
                        </button>

                        <button class="nav-link-item" id="nav-courses-btn" data-query="What courses and engineering branches are offered?">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Curriculum</span>
                        </button>

                        <button class="nav-link-item" id="nav-fees-btn" data-query="How much is the college fee and scholarship options?">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="1" x2="12" y2="23"></line>
                                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Fees & Aid</span>
                        </button>

                        <button class="nav-link-item" id="nav-placements-btn" data-query="How are the college placements and top recruiting companies?">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Placements</span>
                        </button>
                    </div>

                    <!-- Campus Topics Categorized by Relevance -->
                    <div class="history-section" id="history-section">
                        <!-- Admissions & Academics -->
                        <div class="history-group">
                            <div class="history-group-title">Popular Inquiries</div>
                            <div class="history-items-list">
                                <button class="history-item" data-query="What is the admission process and cutoff score?">Admission process & cutoff</button>
                                <button class="history-item" data-query="What engineering branches and courses are offered?">B.Tech branches & syllabus</button>
                                <button class="history-item" data-query="How much is the annual college tuition fee?">Tuition & fee structure</button>
                            </div>
                        </div>

                        <!-- Campus Life -->
                        <div class="history-group">
                            <div class="history-group-title">Campus Life</div>
                            <div class="history-items-list">
                                <button class="history-item" data-query="Does the college provide hostel and mess facilities?">Hostel rooms & mess fees</button>
                                <button class="history-item" data-query="What is the highest placement package and average CTC?">Placement statistics & CTC</button>
                                <button class="history-item" data-query="What are the college timings and library hours?">Campus timings & library</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User Profile Pill (Bottom) -->
                <div class="sidebar-user-footer">
                    <div class="user-profile-card">
                        <div class="user-avatar-wrapper">
                            <div class="user-avatar-circle">
                                <span>SB</span>
                            </div>
                        </div>
                        <div class="user-meta">
                            <span class="user-name">Sairaj Bhandalkar</span>
                            <span class="user-email">Campus Student Portal</span>
                        </div>
                        <button class="user-action-btn" id="voice-toggle-btn" title="Toggle Voice Readout" aria-label="Toggle voice">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- ===================================================================
                 2. MAIN VIEWPORT (Right Area)
                 =================================================================== -->
            <main class="cortex-main-viewport">
                
                <!-- Top Navigation Header -->
                <header class="cortex-top-header">
                    <div class="header-left">
                        <!-- Mobile Hamburger Button -->
                        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open Navigation">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="12" x2="21" y2="12"></line>
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="3" y1="18" x2="21" y2="18"></line>
                            </svg>
                        </button>

                        <!-- Assistant Dropdown Pill -->
                        <div class="cortex-dropdown-wrapper" id="cortex-dropdown-wrapper">
                            <button class="cortex-dropdown-btn" id="cortex-dropdown-btn">
                                <span class="cortex-icon-dot">
                                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none">
                                        <rect width="16" height="16" rx="4" fill="#EBE5FF"/>
                                        <path d="M8 3v10M3 8h10" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                </span>
                                <span class="cortex-dropdown-label">Campus Assistant</span>
                                <span class="cortex-dropdown-chevron">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </span>
                            </button>
                            <div class="cortex-dropdown-menu" id="cortex-dropdown-menu">
                                <button class="cortex-menu-item active" data-model="General">General Campus Query</button>
                                <button class="cortex-menu-item" data-model="Admissions">Admissions & Eligibility</button>
                                <button class="cortex-menu-item" data-model="Academics">Academic Syllabus</button>
                                <button class="cortex-menu-item" data-model="Placements">Placements & Recruiters</button>
                            </div>
                        </div>
                    </div>

                    <!-- Right Action Controls -->
                    <div class="header-right">
                        <!-- Quick Share Link Button -->
                        <button class="header-icon-btn" id="top-link-btn" title="Copy Live Website URL" aria-label="Share live link">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                        </button>

                        <!-- Export Conversation Button -->
                        <button class="header-pill-btn" id="export-chat-btn" title="Export conversation as text file">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            <span>Export</span>
                        </button>

                        <!-- Reset / New Session Button -->
                        <button class="header-solid-btn" id="clear-session-btn" title="Clear current session">
                            <span>Clear chat</span>
                        </button>
                    </div>
                </header>

                <!-- Scrollable Main Content Container -->
                <div class="cortex-scroll-container" id="cortex-scroll-container">
                    
                    <!-- LANDING HERO STATE (Greeting, Interactive 120Hz Orb, Cards) -->
                    <div class="cortex-hero-state" id="cortex-hero-state">
                        
                        <!-- Floating 3D Interactive 120Hz Liquid Violet Orb with Sonic Physics -->
                        <div class="liquid-orb-container" id="interactive-orb" aria-label="Interactive AI Core">
                            <div class="liquid-orb-aura" id="orb-aura"></div>
                            <div class="liquid-orb-core" id="orb-core">
                                <div class="orb-specular-light"></div>
                                <div class="orb-specular-swirl"></div>
                                <div class="orb-soundwave" id="orb-soundwave">
                                    <span></span><span></span><span></span><span></span>
                                </div>
                            </div>
                        </div>

                        <!-- Greeting Hero Typography -->
                        <div class="cortex-greeting-box">
                            <h2 class="greeting-pretitle">Welcome to College AI</h2>
                            <h1 class="greeting-maintitle">How can I assist your campus journey?</h1>
                        </div>

                        <!-- Central Input Dock (High Interaction) -->
                        <div class="cortex-input-card">
                            <div class="input-text-area-wrapper">
                                <textarea 
                                    id="cortex-user-input" 
                                    class="cortex-textarea" 
                                    rows="1" 
                                    placeholder="Ask about admissions, courses, fees, hostels, or placements..." 
                                    autocomplete="off"
                                    autofocus
                                    aria-label="Ask College AI"
                                ></textarea>
                            </div>

                            <!-- Interactive Campus Filter Chips -->
                            <div class="input-chips-toolbar">
                                <div class="chips-list">
                                    <button class="filter-chip-btn" data-query="What is the admission procedure and eligibility?">
                                        <span>🎓 Admission</span>
                                    </button>
                                    <button class="filter-chip-btn" data-query="What are the B.Tech courses and departments?">
                                        <span>📚 Courses</span>
                                    </button>
                                    <button class="filter-chip-btn" data-query="What is the fee structure for engineering?">
                                        <span>💰 Fees</span>
                                    </button>
                                    <button class="filter-chip-btn" data-query="Does the college have hostel facilities?">
                                        <span>🏢 Hostel</span>
                                    </button>
                                    <button class="filter-chip-btn" data-query="What are the campus placement packages?">
                                        <span>💼 Placements</span>
                                    </button>
                                </div>

                                <div class="toolbar-right">
                                    <!-- Circular Lavender Microphone Button -->
                                    <button class="cortex-mic-btn" id="cortex-mic-btn" title="Voice Input (Speech-to-Text)" aria-label="Microphone">
                                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                            <line x1="12" y1="19" x2="12" y2="23"></line>
                                            <line x1="8" y1="23" x2="16" y2="23"></line>
                                        </svg>
                                    </button>

                                    <!-- Send Arrow Button -->
                                    <button class="cortex-send-btn" id="cortex-send-btn" title="Send question" aria-label="Send">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <line x1="22" y1="2" x2="11" y2="13"></line>
                                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 3 Purpose-Driven Campus Action Cards -->
                        <div class="cortex-cards-grid">
                            
                            <!-- Card 1: Admissions & Cutoffs -->
                            <button class="cortex-action-card" data-query="What is the admission process and eligibility criteria?">
                                <div class="card-icon-bubble">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                                    </svg>
                                </div>
                                <h3 class="card-title">Admissions & Eligibility</h3>
                                <p class="card-subtext">Check cutoff scores, eligibility requirements, and enrollment dates.</p>
                            </button>

                            <!-- Card 2: Curriculum & Engineering -->
                            <button class="cortex-action-card" data-query="What courses and engineering branches are offered?">
                                <div class="card-icon-bubble">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                                    </svg>
                                </div>
                                <h3 class="card-title">Course Curriculum</h3>
                                <p class="card-subtext">Explore B.Tech engineering branches, degree programs, and syllabus.</p>
                            </button>

                            <!-- Card 3: Fees & Placements -->
                            <button class="cortex-action-card" data-query="How much is the college fee and hostel accommodation?">
                                <div class="card-icon-bubble">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="12" y1="8" x2="12" y2="12"></line>
                                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                    </svg>
                                </div>
                                <h3 class="card-title">Fees & Accommodation</h3>
                                <p class="card-subtext">View tuition fees, hostel room availability, and placement statistics.</p>
                            </button>
                        </div>
                    </div>

                    <!-- ACTIVE CONVERSATION STATE -->
                    <div class="cortex-chat-state" id="cortex-chat-state" style="display: none;">
                        <div class="chat-thread-wrapper" id="chat-thread-wrapper">
                            <!-- Dynamic messages safely injected here -->
                        </div>
                    </div>

                </div>

                <!-- Sleek Minimal Footer Bar -->
                <footer class="cortex-footer-bar">
                    <div class="footer-status-pill">
                        <span class="status-pulse-dot"></span>
                        <span>College AI System Active • Scikit-Learn ML Backend</span>
                    </div>

                    <div class="footer-meta-link">
                        <span>Created by Sairaj Bhandalkar</span>
                    </div>
                </footer>

                <!-- Floating Bottom Input Dock for Conversation View -->
                <div class="conversation-dock-wrapper" id="conversation-dock-wrapper" style="display: none;">
                    <div class="conversation-dock-inner">
                        <input 
                            type="text" 
                            id="conversation-input" 
                            class="conversation-input-field" 
                            placeholder="Ask a follow-up question..." 
                            autocomplete="off"
                        >
                        <button class="dock-speech-btn" id="dock-speech-btn" title="Voice dictation" aria-label="Voice input">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            </svg>
                        </button>
                        <button class="dock-submit-btn" id="dock-submit-btn" title="Send message" aria-label="Send">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Mobile Drawer Overlay Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- Application Javascript Logic -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
